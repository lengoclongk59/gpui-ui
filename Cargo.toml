[workspace]
members = ["crates/ui", "crates/story"]
default-members = ["crates/story"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
gpui-ui = { path = "crates/ui" }

# GPUI is published as the `gpui-pre-*` snapshot crates of Zed's GPUI. Any
# snapshot may change the API, so the pin is exact and matches gpui-kit 0.10.
# Bump every `gpui-pre-*` crate together.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[workspace.lints.clippy]
mod_module_files = "deny"

[profile.dev]
# GPUI is slow unoptimized; optimize dependencies but keep our crates debuggable.
[profile.dev.package."*"]
opt-level = 2
