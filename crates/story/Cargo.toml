[package]
name = "story"
version = "0.1.0"
description = "Component gallery for gpui-ui, with an optional automation server."
edition.workspace = true
publish.workspace = true

[features]
default = ["screenshot"]
# The `screenshot` automation command renders frames offscreen through GPUI's
# `render_to_image`, which GPUI only compiles with `test-support`.
screenshot = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
gpui-ui.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
